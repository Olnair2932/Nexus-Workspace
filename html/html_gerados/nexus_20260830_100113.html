<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Sandália Feminina</title>
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #0a0b10;
            --card: #161b22;
            --text: #e6edf3;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .product-card { background: var(--card); border: 1px solid #30363d; border-radius: 15px; padding: 20px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .product-img { width: 100%; height: 250px; background: #21262d; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; border: 1px solid var(--primary); }
        .price { font-size: 1.5rem; color: var(--primary); font-weight: bold; margin: 10px 0; }
        .btn { padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: 0.3s; width: 100%; }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn-share { background: #30363d; color: white; border: 1px solid #555; }
        #terminal { margin-top: 30px; width: 100%; max-width: 600px; background: #000; padding: 15px; border-radius: 10px; border: 1px solid var(--primary); }
        #chat-history { height: 200px; overflow-y: auto; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        input { width: 70%; padding: 10px; background: #161b22; border: 1px solid #30363d; color: white; }
        .status { font-size: 0.8rem; margin-bottom: 10px; }
        .online { color: #25d366; }
    </style>
</head>
<body>

<div class="product-card">
    <div class="product-img">Imagem da Sandália</div>
    <h2>Sandália Feminina</h2>
    <p>Sandália Feminina de alta qualidade.</p>
    <div class="price">R$ 100,00</div>
    <button class="btn btn-whatsapp" onclick="window.open('https://wa.me/?text=Tenho interesse na Sandália Feminina')">Comprar pelo WhatsApp</button>
    <button class="btn btn-share" onclick="navigator.share({title: 'Sandália', url: window.location.href})">Compartilhar página</button>
</div>

<div id="terminal">
    <div class="status">Status: <span class="online">● ONLINE</span></div>
    <div id="chat-history"></div>
    <input type="text" id="cmd-input" placeholder="Digite um comando para o Nexus...">
    <button id="exec-btn" onclick="executar()">EXECUTAR</button>
    <button onclick="document.getElementById('chat-history').innerHTML = ''">LIMPAR</button>
</div>

<script>
    const input = document.getElementById('cmd-input');
    const history = document.getElementById('chat-history');
    const btn = document.getElementById('exec-btn');

    async function executar() {
        const comando = input.value.trim();
        if (!comando) return;

        btn.disabled = true;
        const msg = document.createElement('div');
        msg.textContent = "> " + comando;
        history.appendChild(msg);
        input.value = '';

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ texto: comando, voz: false })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.nexus || data.resposta || "Erro HTTP " + response.status);

            const resposta = data.nexus || data.resposta || JSON.stringify(data);
            const resDiv = document.createElement('div');
            resDiv.style.color = "var(--primary)";
            resDiv.textContent = "Nexus: " + resposta;
            history.appendChild(resDiv);
        } catch (erro) {
            const errDiv = document.createElement('div');
            errDiv.style.color = "red";
            errDiv.textContent = "Erro: " + erro.message;
            history.appendChild(errDiv);
        } finally {
            btn.disabled = false;
            history.scrollTop = history.scrollHeight;
        }
    }

    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') executar(); });
</script>

</body>
</html>
