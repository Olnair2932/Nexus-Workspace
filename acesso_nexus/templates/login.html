<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS — Acesso</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            border-radius: 20px;
            background: #1e293b;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }

        .logo {
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 22px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.5;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: white;
            color: #111827;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #mensagem {
            margin-top: 18px;
            min-height: 24px;
            color: #fca5a5;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">🚀 NEXUS</div>

    <h1>NEXUS HTML STUDIO</h1>

    <p>
        Entre com sua conta Google para acessar seu espaço particular.
    </p>

    <button id="btnGoogle">
        🔐 Entrar com Google
    </button>

    <div id="mensagem"></div>

</div>

<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyB0Tr9Dsy-Pn8WSPuTMAsx5j2S8Sc4xIDg",
    authDomain: "finance-master-629d1.firebaseapp.com",
    databaseURL: "https://finance-master-629d1-default-rtdb.firebaseio.com",
    projectId: "finance-master-629d1",
    storageBucket: "finance-master-629d1.firebasestorage.app",
    messagingSenderId: "411976359484",
    appId: "1:411976359484:web:eeee1000da6c1335326d39"
};


const app = initializeApp(firebaseConfig);
const authFirebase = getAuth(app);
const provider = new GoogleAuthProvider();

const botao = document.getElementById("btnGoogle");
const mensagem = document.getElementById("mensagem");


botao.addEventListener("click", async () => {

    botao.disabled = true;
    botao.textContent = "🔄 Validando acesso...";
    mensagem.textContent = "";

    try {

        const resultado = await signInWithPopup(
            authFirebase,
            provider
        );

        const usuario = resultado.user;

        const token = await usuario.getIdToken(true);

        const resposta = await fetch("/api/verificar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                token
            })
        });

        const dados = await resposta.json();

        if (!resposta.ok || !dados.ok) {
            throw new Error(
                dados.erro || "Não foi possível validar o acesso."
            );
        }

        window.location.href = "/painel";

    } catch (erro) {

        console.error("NEXUS LOGIN:", erro);

        mensagem.textContent =
            "❌ " + (erro.message || "Não foi possível realizar o login.");

        botao.disabled = false;
        botao.textContent = "🔐 Entrar com Google";
    }

});

</script>

</body>
</html>
